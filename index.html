<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Médiathèque</title>
  <meta name="description" content="Ma watchlist et mon historique : jeux, films, séries, livres.">
  <meta name="theme-color" content="#FAF7F2">
  <script>
    // Réglages de ressenti gardés sur CET appareil (thème, accent, police…).
    // On les applique AVANT l'affichage de la page, pour éviter un « flash » de couleurs.
    (function () {
      var r = {};
      try { r = JSON.parse(localStorage.getItem("mediatheque-reglages")) || {}; } catch (e) {}
      var racine = document.documentElement;
      var pc = matchMedia("(min-width: 900px)").matches;
      // Accent par défaut : bleu nuit sur le téléphone, pétrole sur le PC
      racine.dataset.accent = r.accent || (pc ? "petrole" : "nuit");
      racine.dataset.police = r.police || "plex";
      // PC : taille du texte (zoom de l'écran) et des jaquettes, largeur de la barre et du panneau
      var zt = +r.texte || 1.1, jq = +r.jaquettes || 1;
      racine.style.setProperty("--zt", zt);
      racine.style.setProperty("--jq", jq / zt);   // compensé : les jaquettes ne suivent pas le zoom du texte
      if (r.largCote) racine.style.setProperty("--larg-cote", r.largCote + "px");
      if (r.largPanneau) racine.style.setProperty("--larg-panneau", r.largPanneau + "px");
      racine.dataset.onglets = "t2";   // (un seul style d'onglets depuis la v0.9.2)
      racine.dataset.anim = r.animations || "completes";
      var sombreTel = matchMedia("(prefers-color-scheme: dark)");
      var choix = r.theme || "auto";
      function appliquer() {
        var theme = choix === "auto" ? (sombreTel.matches ? "sombre" : "clair") : choix;
        racine.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "sombre" ? "#161A22" : "#FAF7F2";
      }
      appliquer();
      sombreTel.addEventListener("change", appliquer);
      window.appliquerTheme = function (nouveau) { choix = nouveau; appliquer(); };
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section id="ecran-connexion" class="connexion" hidden>
  <img src="icones/icone.svg" alt="" width="76" height="76">
  <h1>Médiathèque</h1>
  <button id="btn-connexion" class="btn plein">Se connecter avec Google</button>
  <p id="connexion-erreur" class="erreur" hidden></p>
</section>

<!-- ============ L'APPLI ============
     Une seule page pour le téléphone et le PC : la mise en page change avec la largeur
     de l'écran (classe « pc » ou « tel » posée sur <body> par app.js). -->
<div id="appli" hidden>
  <!-- Barre de gauche (PC seulement) : recherche, types, frise, réglages -->
  <aside id="cote" class="cote"></aside>
  <!-- Bords à attraper (PC) pour élargir la barre de gauche et le panneau de la fiche -->
  <div class="redim" data-redim="cote" title="Glisser pour élargir"></div>

  <main id="zone" class="zone">
    <header id="entete" class="entete"></header>
    <div id="cherche-tel" class="cherche-tel" hidden>
      <svg class="ic"><use href="#i-cherche"></use></svg>
      <input id="recherche-tel" type="search" placeholder="Chercher" aria-label="Chercher">
      <button class="btn-icone" data-action="fermer-recherche" aria-label="Fermer la recherche"><svg class="ic"><use href="#i-x"></use></svg></button>
    </div>
    <div id="outils" class="outils"></div>
    <div id="contenu" class="contenu"></div>
  </main>

  <!-- Fiche sur PC : panneau à droite -->
  <div class="redim" data-redim="panneau" id="redim-panneau" title="Glisser pour élargir" hidden></div>
  <aside id="panneau" class="panneau" hidden></aside>

  <!-- Téléphone : bouton + et onglets du bas -->
  <button id="fab" class="fab" aria-label="Ajouter"><svg class="ic"><use href="#i-plus"></use></svg></button>
  <nav id="onglets" class="onglets"></nav>
</div>

<!-- Fenêtres posées par-dessus (fiche sur téléphone, ajout, réglages…) : remplies par app.js -->
<div id="voile" class="voile" hidden></div>
<!-- 2e couche, au-dessus de la fiche (Choisir l'affiche) -->
<div id="voile2" class="voile voile2" hidden></div>
<!-- Petits menus (statut, tri, tags…) -->
<div id="menu" class="menu-flottant" hidden></div>

<!-- Petit message en bas (avec « Annuler » après une suppression) -->
<div id="toast" class="toast" hidden>
  <span id="toast-texte"></span>
  <button id="toast-annuler">Annuler</button>
</div>
